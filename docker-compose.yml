version: '3.8'

services:
  # PHP + Apache
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hichina_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - hichina_network

  # MySQL
  db:
    image: mysql:8.0
    container_name: hichina_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hichina_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - hichina_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hichina_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - hichina_network

volumes:
  mysql_data:

networks:
  hichina_network:
    driver: bridge
